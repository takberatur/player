services:
    app:
        build:
            context: ../../
            dockerfile: deployment/docker/Dockerfile
        image: ${APP_SERVICE_ID:-forge-player}-app
        container_name: ${APP_SERVICE_ID:-forge-player}-app
        restart: unless-stopped
        working_dir: /var/www/html
        environment:
            APP_NAME: "${APP_NAME:-ForgePlayer}"
            APP_ENV: "${APP_ENV:-production}"
            # Ensure APP_KEY is set in your .env file!
            APP_KEY: "${APP_KEY}"
            APP_DEBUG: "${APP_DEBUG:-false}"
            APP_URL: "${APP_URL:-http://localhost}"
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: "${DB_DATABASE:-forge_player}"
            DB_USERNAME: "${DB_USERNAME:-forge}"
            DB_PASSWORD: "${DB_PASSWORD:-password}"
        volumes:
            - ../../:/var/www/html
            - /var/www/html/node_modules
        networks:
            - forge-network

    web:
        image: nginx:alpine
        container_name: ${APP_SERVICE_ID:-forge-player}-web
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - ../../:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - forge-network
        depends_on:
            - app

    db:
        image: mysql:8.0
        container_name: ${APP_SERVICE_ID:-forge-player}-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: "${DB_DATABASE:-forge_player}"
            MYSQL_USER: "${DB_USERNAME:-forge}"
            MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
        ports:
            - "${DB_PORT_HOST:-33061}:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - forge-network

networks:
    forge-network:
        driver: bridge

volumes:
    dbdata:
